server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ip}:3306/room_reservation?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    # 探测与投递的快速失败窗口，broker 不可用时事件转同步降级
    connection-timeout: 1000ms
    listener:
      simple:
        acknowledge-mode: manual
        # 队列尚未声明时不阻塞应用启动，broker 不可用也能起
        missing-queues-fatal: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 1000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 默认不打印 SQL，排查时把 com.roomreservation.mapper 调到 debug
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      update-strategy: IGNORED

# SQL 日志按需开启，避免标准输出成为并发瓶颈
logging:
  level:
    com.roomreservation.mapper: warn

ip: 127.0.0.1

# 阶段 A 增强开关，关闭或依赖不可用时回退原路径
app:
  enhance:
    cache-enabled: true
    rate-limit-enabled: true
    activity-enabled: true
    risk-enabled: true
    cache-ttl-seconds: 60
    rate-limit-per-minute: 10
    auth-rate-limit-per-minute: 20
    # 阶段 C：MQ 事件总线开关与投递补偿参数
    mq-enabled: true
    mq-publish-timeout-ms: 500
    outbox-retry-seconds: 30
    outbox-max-retry: 10
    dlq-max-redelivery: 5
  mail:
    # 邮件通道未接入，找回密码生成的令牌随响应返回便于本地联调
    enabled: false
